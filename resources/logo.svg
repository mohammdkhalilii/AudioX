<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Cyan to Violet Gradient -->
    <linearGradient id="logoBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Emerald to Teal Accent -->
    <linearGradient id="logoBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Text Gradient for "X" -->
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="badgeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (x: 20, y: 20, w: 140, h: 140) -->
  <g transform="translate(20, 20)">
    <!-- Squircle Tile -->
    <rect width="140" height="140" rx="32" fill="url(#badgeGlow)" />
    <rect width="139" height="139" x="0.5" y="0.5" rx="31.5" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

    <!-- Ambient Center Light -->
    <circle cx="70" cy="70" r="35" fill="#6366F1" opacity="0.2" filter="url(#logoGlow)" />

    <!-- Left Sound Bars (Raw Audio) -->
    <g opacity="0.4" stroke="#94A3B8" stroke-linecap="round" stroke-width="2.5">
      <line x1="22" y1="65" x2="22" y2="75" />
      <line x1="28" y1="58" x2="28" y2="82" />
      <line x1="34" y1="48" x2="34" y2="92" />
      <line x1="40" y1="62" x2="40" y2="78" />
    </g>

    <!-- Right Sound Bars (Clean Audio) -->
    <g stroke="url(#logoBeam1)" stroke-linecap="round" stroke-width="2.5">
      <line x1="100" y1="46" x2="100" y2="94" opacity="0.8" />
      <line x1="106" y1="56" x2="106" y2="84" opacity="0.65" />
      <line x1="112" y1="50" x2="112" y2="90" opacity="0.5" />
      <line x1="118" y1="64" x2="118" y2="76" opacity="0.3" />
    </g>

    <!-- Diagonal crossing beams -->
    <path
      d="M 44 40 C 54 54, 62 62, 70 70 C 78 78, 86 86, 96 100"
      fill="none"
      stroke="url(#logoBeam1)"
      stroke-width="9"
      stroke-linecap="round"
      filter="url(#logoGlow)"
    />
    <path
      d="M 44 100 C 54 86, 62 78, 70 70 C 78 62, 86 54, 96 40"
      fill="none"
      stroke="url(#logoBeam2)"
      stroke-width="9"
      stroke-linecap="round"
      filter="url(#logoGlow)"
    />

    <!-- Inner Core Crisp Lines -->
    <path d="M 47 43 L 93 97" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 47 97 L 93 43" fill="none" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Core Focal Point -->
    <circle cx="70" cy="70" r="4.5" fill="#FFFFFF" filter="url(#logoGlow)" />
    <circle cx="70" cy="70" r="2" fill="#38BDF8" />
  </g>

  <!-- Typography: "AudioX" -->
  <g transform="translate(186, 106)">
    <!-- "Audio" in crisp high-contrast sans -->
    <text
      x="0"
      y="0"
      fill="#F8FAFC"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif"
      font-size="74"
      font-weight="800"
      letter-spacing="-1.5"
    >Audio</text>

    <!-- "X" in Vibrant Gradient -->
    <text
      x="222"
      y="0"
      fill="url(#xGradient)"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif"
      font-size="74"
      font-weight="900"
      letter-spacing="-1.5"
      filter="url(#logoGlow)"
    >X</text>
  </g>

  <!-- Subtitle Tagline & Badges -->
  <g transform="translate(190, 138)">
    <text
      x="0"
      y="0"
      fill="#94A3B8"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif"
      font-size="14"
      font-weight="600"
      letter-spacing="3.2"
    >OFFLINE-FIRST VOICE AUDIO CLEANER</text>
  </g>

  <!-- Subtle Accent Pip -->
  <circle cx="705" cy="90" r="4" fill="#38BDF8" opacity="0.8" filter="url(#logoGlow)" />
  <circle cx="720" cy="90" r="2.5" fill="#6366F1" opacity="0.6" />
</svg>
