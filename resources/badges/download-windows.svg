<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="100%" height="100%">
  <!-- Background with subtle border -->
  <rect x="1" y="1" width="358" height="118" rx="22" fill="#000000" stroke="#9E9E9E" stroke-width="2.5"/>

  <!-- Windows 4-Color Grid Logo -->
  <g transform="translate(28, 30)">
    <rect x="0" y="0" width="28" height="28" fill="#F25022"/>
    <rect x="32" y="0" width="28" height="28" fill="#7FBA00"/>
    <rect x="0" y="32" width="28" height="28" fill="#00A4EF"/>
    <rect x="32" y="32" width="28" height="28" fill="#FFB900"/>
  </g>

  <!-- Text -->
  <text x="122" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">Download for</text>
  <text x="120" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="-0.5">Windows</text>
