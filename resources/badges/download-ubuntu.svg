    <circle cx="32" cy="32" r="31" fill="#E95420"/>

    <!-- Exact Canonical Ubuntu Paths -->
    <path fill="#FFFFFF" d="M32,15.2c5.9,0,11.2,3.1,14.2,7.7l-5.3,3.1c-2.1-3-5.3-4.7-8.9-4.7c-6.1,0-11,4.9-11,11c0,0.4,0,0.8,0.1,1.2l-6.1,0.5c-0.1-0.6-0.1-1.1-0.1-1.7C15,22.8,22.6,15.2,32,15.2z"/>
    <path fill="#FFFFFF" d="M15.1,34.8c0.8,8.8,8.2,15.7,17.2,15.7c3.7,0,7.1-1.3,9.7-3.6l-4-4.7c-1.7,1.4-3.6,2.2-5.7,2.2c-5.7,0-10.4-4.3-10.9-9.8L15.1,34.8z"/>
    <path fill="#FFFFFF" d="M47.7,39.6c1.6-2.3,2.5-5,2.5-7.9c0-1.8-0.4-3.6-1-5.2l-5.7,2.1c0.4,1,0.6,2.1,0.6,3.1c0,2.5-1,4.7-2.6,6.4L47.7,39.6z"/>

