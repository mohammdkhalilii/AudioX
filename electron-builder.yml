appId: studio.emya.audiox
productName: AudioX
afterPack: scripts/afterPack.cjs
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
  - resources/**/*
extraResources:
  - from: resources/binaries/${os}-${arch}
    to: binaries
    filter:
      - "**/*"
  - from: resources/engine-manifest.json
    to: engine-manifest.json
mac:
  category: public.app-category.audio-video
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
